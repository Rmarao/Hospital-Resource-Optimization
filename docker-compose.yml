services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: hospital_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/hospital_db?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-CHANGE_ME}
      GOOGLE_FIT_CLIENT_ID: ${GOOGLE_FIT_CLIENT_ID:-CHANGE_ME}
      GOOGLE_FIT_CLIENT_SECRET: ${GOOGLE_FIT_CLIENT_SECRET:-CHANGE_ME}
      GOOGLE_FIT_REDIRECT_URI: ${GOOGLE_FIT_REDIRECT_URI:-http://localhost:8080/patient/fitness/callback}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
