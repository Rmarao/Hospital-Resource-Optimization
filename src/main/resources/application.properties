# ── Server ──────────────────────────────────────────────
server.port=8080

# ── MySQL / JPA ─────────────────────────────────────────
# All secrets below come from environment variables — see README "Setup"
# for the full list. Nothing sensitive is committed to this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Sized for a small-scale deployment (a handful of concurrent admin/doctor
# users, not high-throughput traffic) — raise maximum-pool-size if the
# actual deployment's concurrency turns out higher.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Flyway (src/main/resources/db/migration) now owns schema changes;
# Hibernate only validates the entities match, it no longer alters the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ── JSP view resolver ───────────────────────────────────
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ── Groq LLM API (patient triage analysis) ──────────────
# Get a free key at https://console.groq.com
groq.api.key=${GROQ_API_KEY:CHANGE_ME}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# ── Google Fit OAuth (patient fitness tracking) ─────────
# Create OAuth credentials at https://console.cloud.google.com
google.fit.client.id=${GOOGLE_FIT_CLIENT_ID:CHANGE_ME}
google.fit.client.secret=${GOOGLE_FIT_CLIENT_SECRET:CHANGE_ME}
google.fit.redirect.uri=${GOOGLE_FIT_REDIRECT_URI:http://localhost:8080/patient/fitness/callback}

# ── Actuator (health checks) ─────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── Field-level encryption at rest (Google Fit tokens, medical history) ──
# Base64-encoded AES-256 key. Generate one with:
#   openssl rand -base64 32
# If unset, an ephemeral key is generated at startup and a warning logged —
# fine for a throwaway dev run, but encrypted data becomes unreadable after
# restart. Always set this in any persistent environment.
app.encryption.key=${APP_ENCRYPTION_KEY:}
