# Activated via SPRING_PROFILES_ACTIVE=prod. Everything here is either
# tightened from the dev defaults or intentionally different for a
# real deployment; secrets still come from the same env vars documented
# in the README (this profile doesn't add new ones).

spring.jpa.show-sql=false

# Don't leak stack traces or internal error detail to clients.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Health details (DB status, disk space, etc.) only for authenticated
# operator access, not anonymously over the public internet.
management.endpoint.health.show-details=never

# devtools auto-disables itself when packaged, but be explicit.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
