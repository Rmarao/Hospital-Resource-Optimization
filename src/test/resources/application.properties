# Test profile — in-memory H2 instead of MySQL (no Docker/Testcontainers
# available in this dev environment; H2 is the standard no-infra fallback
# for exercising JPQL @Query correctness).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# Flyway migrations are MySQL-specific; tests use Hibernate ddl-auto against H2 instead.
spring.flyway.enabled=false
# @DataJpaTest's slice filtering excludes CacheConfig's CacheManager bean,
# but @EnableCaching (on the main app class, always active) still requires
# one to exist — spring.cache.type=none installs a NoOpCacheManager instead.
spring.cache.type=none

app.encryption.key=2/arjrQecxXiVDYf5T+DT9D5CSMOePSzZSSh0oLszns=

groq.api.key=test
groq.api.url=http://localhost/unused
groq.model=test

google.fit.client.id=test
google.fit.client.secret=test
google.fit.redirect.uri=http://localhost/unused
